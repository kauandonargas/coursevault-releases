name: Publicar CourseVault 1.4.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENCODED_ASSET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador validado de CourseVault
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$ENCODED_ASSET_URL" | base64 --decode | tr -d '"')"
          case "$URL" in https://release-assets.githubusercontent.com/*) ;; *) echo "URL de asset nao permitida"; exit 1;; esac
          curl --fail --location --retry 3 --silent --show-error --output CourseVault-Setup-1.4.6-x64.exe "$URL"
          echo "52ab3016bdc7f197df5260f18121a782e0c1a7b2c908b38b550e880b7b3988ae  CourseVault-Setup-1.4.6-x64.exe" | sha256sum --check -
          sha256sum CourseVault-Setup-1.4.6-x64.exe > CourseVault-Setup-1.4.6-x64.exe.sha256
          ls -lh CourseVault-Setup-1.4.6-x64.exe
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.6 \
            CourseVault-Setup-1.4.6-x64.exe \
            CourseVault-Setup-1.4.6-x64.exe.sha256 \
            --title "CourseVault 1.4.6" \
            --notes "Home de videos com capas originais, colecoes criadas pelo usuario no VideoFlow, filtros e ranking local por historico, favoritos, interesses e diversidade. Dados, progresso e videos antigos preservados."
      - name: Atualizar canal de versoes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          manifest={
            "schemaVersion":1,
            "product":"CourseVault",
            "version":"1.4.6",
            "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
            "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.6/CourseVault-Setup-1.4.6-x64.exe",
            "sha256":"52ab3016bdc7f197df5260f18121a782e0c1a7b2c908b38b550e880b7b3988ae",
            "mandatory":False,
            "notes":[
              "Nova home de videos com grade de capas originais, duracao, criador, progresso e colecoes.",
              "VideoFlow 1.0.5 salva os downloads em pastas de colecao escolhidas pelo usuario.",
              "Recomendacoes locais por historico, favoritos, termos de titulo, recencia e diversidade.",
              "Filtros por colecao, nao assistidos, continuar, recentes e favoritos.",
              "Nao recomendar retira da home sem apagar arquivo; titulos e legendas locais reconhecidos."
            ]
          }
          with open('update.json','w',encoding='utf-8') as f:
            json.dump(manifest,f,ensure_ascii=False,indent=2)
            f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Publicar atualizacao CourseVault 1.4.6'
          git push
