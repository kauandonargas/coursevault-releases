name: Publicar CourseVault 1.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.1.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar instalador gerado
        shell: pwsh
        run: |
          $url = 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cefc-820e-b9ba-43ed156c5e34/raw?se=2026-10-15T02%3A46%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=c169e54f-cb56-5a83-be3b-aa8767f84951&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A01%3A29Z&ske=2026-10-15T05%3A01%3A29Z&sks=b&skv=2026-02-06&sig=AU3qh2guqstmBOvoOwdFTimiAU3v3rMhrJpHL2dhANs%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force

      - name: Validar SHA-256
        shell: pwsh
        run: |
          $exe = 'artifact/CourseVault-Setup-1.1.4-x64.exe'
          if (-not (Test-Path $exe)) { throw 'Instalador não encontrado no artefato.' }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '6d3a6c38c4a3f451471d769ce72dd8b8df5cee03d3f8169842c3519af544bddc'
          if ($hash -ne $expected) { throw "SHA-256 inválido: $hash" }
          Write-Host "SHA-256 validado: $hash"

      - name: Criar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.4 `
            'artifact/CourseVault-Setup-1.1.4-x64.exe' `
            'artifact/CourseVault-Setup-1.1.4-x64.exe.sha256' `
            --title 'CourseVault 1.1.4' `
            --notes 'Melhora a vinculação com o Prisma: galeria visual com miniaturas dos vídeos, capas dos PDFs, curso, módulo, filtros e progresso.'

      - name: Atualizar feed público
        shell: pwsh
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'CourseVault'
            version = '1.1.4'
            publishedAt = $publishedAt
            installerUrl = 'https://github.com/kauandonargas/coursevault-releases/releases/download/v1.1.4/CourseVault-Setup-1.1.4-x64.exe'
            sha256 = '6d3a6c38c4a3f451471d769ce72dd8b8df5cee03d3f8169842c3519af544bddc'
            mandatory = $false
            notes = @(
              'A tela de vínculo com o Prisma agora mostra uma galeria visual de materiais.',
              'Aulas exibem miniaturas geradas automaticamente a partir do próprio vídeo.',
              'PDFs exibem a capa ou a primeira página.',
              'Busca e filtros mostram curso, módulo e progresso para facilitar a escolha.'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content update.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Atualiza feed para CourseVault 1.1.4'
          git push
