name: Publicar CourseVault 1.4.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador do build Windows aprovado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9a18-820e-918d-78cc087b465f/raw?se=2026-11-07T07%3A56%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=b0c040e2-8172-54d1-b67c-28f8cd262f52&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A36%3A31Z&ske=2026-11-08T00%3A36%3A31Z&sks=b&skv=2026-02-06&sig=PyxPegYQhyEKUOME%2B6vN5OWmcVaTb7LiWsgUofRs8EM%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output artifact.zip "$ARTIFACT_URL"
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Validar SHA-256 do instalador
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          echo "0673e90cbfde783355253ef8403b0f6464d668d60f8b7dd2be9933663c736f47  CourseVault-Setup-1.4.3-x64.exe" | sha256sum --check -
          sha256sum --check CourseVault-Setup-1.4.3-x64.exe.sha256
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.3 \
            artifact/CourseVault-Setup-1.4.3-x64.exe \
            artifact/CourseVault-Setup-1.4.3-x64.exe.sha256 \
            --title "CourseVault 1.4.3" \
            --notes "Visualizador de artes sempre centralizado com prévias ampliadas em cache de até 1800 px, carregamento progressivo, tratamento de falhas e abertura do original pelo Windows. Botão Todos os artistas acompanha a rolagem. Mosaico e dados preservados."
      - name: Atualizar canal de atualização do CourseVault
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          manifest={
              "schemaVersion":1,
              "product":"CourseVault",
              "version":"1.4.3",
              "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.3/CourseVault-Setup-1.4.3-x64.exe",
              "sha256":"0673e90cbfde783355253ef8403b0f6464d668d60f8b7dd2be9933663c736f47",
              "mandatory":False,
              "notes":[
                  "Visor das obras centralizado e independente da rolagem.",
                  "Prévia otimizada de até 1800 px, sem carregar o original gigante diretamente na interface.",
                  "Botões Abrir original e Mostrar arquivo; mensagens claras em caso de falha.",
                  "Botão Todos os artistas agora acompanha a rolagem da galeria.",
                  "Mosaico natural, carregamento parcial, dados e progresso preservados."
              ]
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publicar atualização CourseVault 1.4.3"
          git push
