name: Publicar Acervo 1.4.14 para atualizacao automatica
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-acervo-1.4.14.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCODED_ASSET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e verificar instalador validado Acervo 1.4.14
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$ENCODED_ASSET_URL" | base64 --decode | tr -d '"')"
          case "$URL" in https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;; *) echo "Host nao autorizado"; exit 1;; esac
          curl --fail --location --retry 3 --silent --show-error --output Acervo-Setup-1.4.14-x64.exe "$URL"
          echo "b376fdb778be25d01a61d568303f342aa025e3a553e28f0c5933018fd0aa9a1b  Acervo-Setup-1.4.14-x64.exe" | sha256sum --check -
          sha256sum Acervo-Setup-1.4.14-x64.exe > Acervo-Setup-1.4.14-x64.exe.sha256
      - name: Publicar release publica
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.14 --repo kauandonargas/coursevault-releases >/dev/null 2>&1; then
            gh release upload v1.4.14 Acervo-Setup-1.4.14-x64.exe Acervo-Setup-1.4.14-x64.exe.sha256 --clobber --repo kauandonargas/coursevault-releases
          else
            gh release create v1.4.14 Acervo-Setup-1.4.14-x64.exe Acervo-Setup-1.4.14-x64.exe.sha256 \
              --repo kauandonargas/coursevault-releases --title 'Acervo 1.4.14' \
              --notes 'Biblioteca agora espelha pastas e subpastas reais do Windows. Acoes extras de criar, renomear, excluir e mover PDFs entre categorias foram removidas. Pastas com nomes iguais em diferentes bibliotecas permanecem separadas. Sem alterar a descoberta de PDFs ou o sistema de cursos.'
          fi
          gh release view v1.4.14 --repo kauandonargas/coursevault-releases --json assets --jq '.assets[].name' | grep -Fx 'Acervo-Setup-1.4.14-x64.exe'
      - name: Ativar nova versao no atualizador do Acervo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          manifest={
            "schemaVersion":1,
            "product":"Acervo",
            "version":"1.4.14",
            "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
            "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.14/Acervo-Setup-1.4.14-x64.exe",
            "sha256":"b376fdb778be25d01a61d568303f342aa025e3a553e28f0c5933018fd0aa9a1b",
            "mandatory":False,
            "notes":[
              "Biblioteca agora mostra a organização real de pastas e subpastas do Windows.",
              "Pastas com PDFs aparecem com mosaicos de capas, sem misturar arquivos de subpastas diferentes.",
              "Removidas funções extras de criar, renomear e excluir categorias no aplicativo.",
              "Para organizar PDFs, use o Explorador do Windows e clique em Reanalisar.",
              "Busca de PDFs original, cursos, vídeos, artistas e ferramentas de legendas preservados."
            ]
          }
          with open("update.json","w",encoding="utf-8") as f:
            json.dump(manifest,f,indent=2,ensure_ascii=False)
            f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar Acervo 1.4.14 com pastas do Windows'
            git push
          fi
