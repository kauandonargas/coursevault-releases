name: Publicar CourseVault 1.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador do build Windows aprovado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5b44-820e-b868-a1791976e86e/raw?se=2026-11-07T06%3A46%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=50cea584-45d0-582f-9e90-2e7e080105cb&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A41%3A30Z&ske=2026-11-08T00%3A41%3A30Z&sks=b&skv=2026-02-06&sig=EEh3EAwqUW4AaK%2BCjf68GqcBpVTy7DdRthf/vR6zfKw%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output artifact.zip "$ARTIFACT_URL"
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Validar SHA-256 do instalador
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          echo "fe7982d118fba9b21ef5de9b3a71ff11fcde03c4304c48f573bfb171432d988c  CourseVault-Setup-1.4.2-x64.exe" | sha256sum --check -
          sha256sum --check CourseVault-Setup-1.4.2-x64.exe.sha256
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.2 \
            artifact/CourseVault-Setup-1.4.2-x64.exe \
            artifact/CourseVault-Setup-1.4.2-x64.exe.sha256 \
            --title "CourseVault 1.4.2" \
            --notes "Restaura mosaico de obras com proporções naturais e sem molduras artificiais. Carregamento progressivo em blocos de 72, começando pelo topo e priorizando miniaturas visíveis. Dimensões rápidas e em cache, renderização virtualizada, histórico e dados preservados."
      - name: Atualizar canal de atualização do CourseVault
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          manifest={
              "schemaVersion":1,
              "product":"CourseVault",
              "version":"1.4.2",
              "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.2/CourseVault-Setup-1.4.2-x64.exe",
              "sha256":"fe7982d118fba9b21ef5de9b3a71ff11fcde03c4304c48f573bfb171432d988c",
              "mandatory":False,
              "notes":[
                  "Galeria de artistas volta a respeitar a proporção natural de cada obra, sem molduras artificiais.",
                  "Preparação das obras em blocos de 72, do topo para baixo e conforme você navega.",
                  "Miniaturas na tela têm prioridade; as distantes aguardam a rolagem.",
                  "Cache de dimensões por imagem e mosaico virtualizado preservam a estabilidade e o desempenho."
              ]
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publicar atualização CourseVault 1.4.2"
          git push
