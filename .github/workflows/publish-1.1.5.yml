name: Publicar CourseVault 1.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.1.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar instalador gerado
        shell: pwsh
        run: |
          $url = 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0d78-820e-886a-b43e6d88f327/raw?se=2026-10-15T04%3A02%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=96fe0f89-4ebe-5fcb-95e1-d6991afefe06&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T10%3A34%3A17Z&ske=2026-10-15T10%3A34%3A17Z&sks=b&skv=2026-02-06&sig=B3q9XOiw7glYQdA8L73msNms6rqE6frhExxwDQ0DKsc%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force

      - name: Validar SHA-256
        shell: pwsh
        run: |
          $exe = 'artifact/CourseVault-Setup-1.1.5-x64.exe'
          if (-not (Test-Path $exe)) { throw 'Instalador não encontrado no artefato.' }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '1876dda64980e0ace2de2cf1b0a8aadfef5e879a1792116ad13fd2fb18afa922'
          if ($hash -ne $expected) { throw "SHA-256 inválido: $hash" }
          Write-Host "SHA-256 validado: $hash"

      - name: Criar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.5 `
            'artifact/CourseVault-Setup-1.1.5-x64.exe' `
            'artifact/CourseVault-Setup-1.1.5-x64.exe.sha256' `
            --title 'CourseVault 1.1.5' `
            --notes 'Corrige a atualização silenciosa no Windows usando o instalador NSIS one-click. Mantém a galeria visual de vínculo com o Prisma.'

      - name: Atualizar feed público
        shell: pwsh
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'CourseVault'
            version = '1.1.5'
            publishedAt = $publishedAt
            installerUrl = 'https://github.com/kauandonargas/coursevault-releases/releases/download/v1.1.5/CourseVault-Setup-1.1.5-x64.exe'
            sha256 = '1876dda64980e0ace2de2cf1b0a8aadfef5e879a1792116ad13fd2fb18afa922'
            mandatory = $false
            notes = @(
              'Corrige o ciclo em que Instalar e reiniciar voltava para a mesma versão.',
              'O instalador de atualização agora usa o modo NSIS one-click, próprio para atualização silenciosa.',
              'Mantém a galeria visual de vínculo com o Prisma da versão 1.1.4.'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content update.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Atualiza feed para CourseVault 1.1.5'
          git push
