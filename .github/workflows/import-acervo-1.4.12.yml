name: Publicar Acervo 1.4.12 para atualizacao automatica
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-acervo-1.4.12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCODED_ASSET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e conferir instalador 1.4.12
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$ENCODED_ASSET_URL" | base64 --decode | tr -d '"')"
          case "$URL" in https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;; *) echo "Host nao autorizado"; exit 1;; esac
          curl --fail --location --retry 3 --silent --show-error --output Acervo-Setup-1.4.12-x64.exe "$URL"
          echo "fdb3b5bb8d5c8f0b0dfe6a2d032d2b8c9b07241c2813dc102e4d236300b36087  Acervo-Setup-1.4.12-x64.exe" | sha256sum --check -
          sha256sum Acervo-Setup-1.4.12-x64.exe > Acervo-Setup-1.4.12-x64.exe.sha256
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.12 --repo kauandonargas/coursevault-releases >/dev/null 2>&1; then
            gh release upload v1.4.12 Acervo-Setup-1.4.12-x64.exe Acervo-Setup-1.4.12-x64.exe.sha256 --clobber --repo kauandonargas/coursevault-releases
          else
            gh release create v1.4.12 Acervo-Setup-1.4.12-x64.exe Acervo-Setup-1.4.12-x64.exe.sha256 \
              --repo kauandonargas/coursevault-releases --title 'Acervo 1.4.12' \
              --notes 'Biblioteca com pastas em cards semelhantes a galeria de Artistas. Cada card exibe mosaico de capas de ate tres PDFs indexados. Inclui criacao de pastas fisicas no Windows. Busca de PDFs da versao 1.4.9 preservada.'
          fi
          gh release view v1.4.12 --repo kauandonargas/coursevault-releases --json assets --jq '.assets[].name' | grep -Fx 'Acervo-Setup-1.4.12-x64.exe'
      - name: Ativar atualizacao no Acervo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          manifest={
            "schemaVersion":1,
            "product":"Acervo",
            "version":"1.4.12",
            "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
            "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.12/Acervo-Setup-1.4.12-x64.exe",
            "sha256":"fdb3b5bb8d5c8f0b0dfe6a2d032d2b8c9b07241c2813dc102e4d236300b36087",
            "mandatory":False,
            "notes":[
              "Biblioteca agora abre com cards visuais de pastas, como a galeria de Artistas.",
              "Cada card mostra um mosaico de ate tres capas dos livros da pasta.",
              "Crie, renomeie e gerencie pastas reais diretamente no Acervo.",
              "Clique em uma pasta para ver seus PDFs ou use Todos os livros e Sem categoria.",
              "Corrige a inclusao indevida de PDFs: pesquisa original da 1.4.9 preservada."
            ]
          }
          with open("update.json","w",encoding="utf-8") as f:
            json.dump(manifest,f,indent=2,ensure_ascii=False)
            f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ativar atualizacao automatica Acervo 1.4.12'
            git push
          fi
