name: Publicar Acervo 1.4.15 no atualizador
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-acervo-1.4.15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCODED_ASSET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e conferir instalador Acervo 1.4.15
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$ENCODED_ASSET_URL" | base64 --decode | tr -d '"')"
          case "$URL" in https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;; *) echo "Host nao autorizado"; exit 1;; esac
          curl --fail --location --retry 3 --silent --show-error --output Acervo-Setup-1.4.15-x64.exe "$URL"
          echo "de7074d50b8f6d7cec9d9ea4f4b0a62530665f1ffa47c902f6d235922f15449b  Acervo-Setup-1.4.15-x64.exe" | sha256sum --check -
          sha256sum Acervo-Setup-1.4.15-x64.exe > Acervo-Setup-1.4.15-x64.exe.sha256
      - name: Publicar release publica
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.15 --repo kauandonargas/coursevault-releases >/dev/null 2>&1; then
            gh release upload v1.4.15 Acervo-Setup-1.4.15-x64.exe Acervo-Setup-1.4.15-x64.exe.sha256 --clobber --repo kauandonargas/coursevault-releases
          else
            gh release create v1.4.15 Acervo-Setup-1.4.15-x64.exe Acervo-Setup-1.4.15-x64.exe.sha256 \
              --repo kauandonargas/coursevault-releases --title 'Acervo 1.4.15' \
              --notes 'Permite ocultar pastas apenas da Biblioteca de PDFs sem afetar arquivos do Windows ou cursos, com opção de restaurar cada pasta. Também ignora raízes compostas exclusivamente por cursos.'
          fi
          gh release view v1.4.15 --repo kauandonargas/coursevault-releases --json assets --jq '.assets[].name' | grep -Fx 'Acervo-Setup-1.4.15-x64.exe'
      - name: Ativar versao 1.4.15 no atualizador do Acervo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          manifest={"schemaVersion":1,"product":"Acervo","version":"1.4.15","installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.15/Acervo-Setup-1.4.15-x64.exe","sha256":"de7074d50b8f6d7cec9d9ea4f4b0a62530665f1ffa47c902f6d235922f15449b","mandatory":false,"notes":["Agora é possível ocultar pastas indevidas somente da Biblioteca de PDFs.","O botão Ocultar não altera as pastas do Windows nem a área Cursos.","As pastas ocultas continuam ocultas após reiniciar e reanalisar; podem ser restauradas.","Bibliotecas que contêm exclusivamente cursos deixam de aparecer na área de PDFs.","Organização original do Windows, capas de livros e leitura de PDFs preservadas."]}
          manifest["publishedAt"]=datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,indent=2,ensure_ascii=False)
              f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ativar atualizacao automatica Acervo 1.4.15'
            git push
          fi
