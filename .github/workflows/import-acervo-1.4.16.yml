name: Publicar Acervo 1.4.16 no atualizador
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-acervo-1.4.16.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCODED_ASSET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Transferir e verificar instalador Acervo 1.4.16
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$ENCODED_ASSET_URL" | base64 --decode | tr -d '"')"
          case "$URL" in https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;; *) echo "Host nao autorizado"; exit 1;; esac
          curl --fail --location --retry 3 --silent --show-error --output Acervo-Setup-1.4.16-x64.exe "$URL"
          echo "2fa2f6da1dbba94ad1829817ee3a730f73d46423400bf181b4afaaccc1c45864  Acervo-Setup-1.4.16-x64.exe" | sha256sum --check -
          sha256sum Acervo-Setup-1.4.16-x64.exe > Acervo-Setup-1.4.16-x64.exe.sha256
      - name: Publicar release publica
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.16 --repo kauandonargas/coursevault-releases >/dev/null 2>&1; then
            gh release upload v1.4.16 Acervo-Setup-1.4.16-x64.exe Acervo-Setup-1.4.16-x64.exe.sha256 --clobber --repo kauandonargas/coursevault-releases
          else
            gh release create v1.4.16 Acervo-Setup-1.4.16-x64.exe Acervo-Setup-1.4.16-x64.exe.sha256 \
              --repo kauandonargas/coursevault-releases --title 'Acervo 1.4.16' \
              --notes 'Botao Escolher um video para mim: sorteio uniforme de videos locais, com miniatura e opcoes Assistir agora e Sortear outro. Sem mudar arquivos, cursos ou PDFs.'
          fi
          gh release view v1.4.16 --repo kauandonargas/coursevault-releases --json assets --jq '.assets[].name' | grep -Fx 'Acervo-Setup-1.4.16-x64.exe'
      - name: Ativar versao 1.4.16 no atualizador do Acervo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          manifest=json.loads(r'''{"schemaVersion":1,"product":"Acervo","version":"1.4.16","installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.16/Acervo-Setup-1.4.16-x64.exe","sha256":"2fa2f6da1dbba94ad1829817ee3a730f73d46423400bf181b4afaaccc1c45864","mandatory":false,"notes":["Na seção Vídeos, o botão Escolher um vídeo para mim sorteia vídeos da biblioteca local.","O sorteio não depende do histórico ou das recomendações; não repete imediatamente o anterior quando houver alternativas.","O vídeo sorteado mostra capa e título, com opções para assistir ou sortear outro.","Vídeos ocultos das recomendações ou removidos da biblioteca ficam fora do sorteio.","Cursos, PDFs, artistas e ferramentas de legendas permanecem inalterados."]}''')
          manifest["publishedAt"]=datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,indent=2,ensure_ascii=False)
              f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ativar atualizacao automatica Acervo 1.4.16'
            git push
          fi
