name: Publicar CourseVault 1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador do build Windows validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1a60-820e-b065-d0c18ba6468f/raw?se=2026-11-07T05%3A59%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=c5d49f62-bd31-5a7d-ac8a-f1f88ab50322&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A31%3A11Z&ske=2026-11-08T00%3A31%3A11Z&sks=b&skv=2026-02-06&sig=oYiUKcOwlaldUGJWx5mCGdqbSbj8eBVZjTkf5UfnSQM%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output artifact.zip "$ARTIFACT_URL"
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Validar SHA-256 do instalador
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          echo "393beec4abd14f53c147089287e6e94dddd6d8d57360f136dbb5ed0f8e9b996c  CourseVault-Setup-1.4.0-x64.exe" | sha256sum --check -
          sha256sum --check CourseVault-Setup-1.4.0-x64.exe.sha256
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.0 \
            artifact/CourseVault-Setup-1.4.0-x64.exe \
            artifact/CourseVault-Setup-1.4.0-x64.exe.sha256 \
            --title "CourseVault 1.4.0" \
            --notes "Nova aba Vídeos com página inicial dinâmica, destaque, Continue assistindo, Para você, Descobertas, Favoritos e pastas. Legendas automáticas locais com Whisper + FFmpeg opcionais: gera SRT sem upload, com sincronização no player e suporte a MPV. Exige configurar ferramentas e modelo Whisper para transcrição. Dados e progresso preservados."
      - name: Atualizar canal de atualização do CourseVault
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          manifest = {
              "schemaVersion": 1,
              "product": "CourseVault",
              "version": "1.4.0",
              "publishedAt": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "installerUrl": "https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.0/CourseVault-Setup-1.4.0-x64.exe",
              "sha256": "393beec4abd14f53c147089287e6e94dddd6d8d57360f136dbb5ed0f8e9b996c",
              "mandatory": False,
              "notes": [
                  "Vídeos avulsos agora têm uma página inicial dinâmica com destaques e sugestões.",
                  "Novas seções Continue assistindo, Para você, Descobertas, Favoritos e pastas.",
                  "Todos os vídeos continuam acessíveis na grade completa.",
                  "Geração local e opcional de legendas com FFmpeg, whisper.cpp e modelo Whisper.",
                  "Arquivos SRT/VTT existentes e legendas geradas são exibidos no player; suporte também ao MPV."
              ]
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publicar atualização CourseVault 1.4.0"
          git push
