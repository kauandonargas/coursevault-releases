name: Publicar CourseVault 1.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar instalador gerado
        shell: pwsh
        run: |
          $url = 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e09c-820e-ac21-5e0b3e431545/raw?se=2026-10-15T01%3A48%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=ea8596a5-7ce7-50a7-83ac-ccdc09e75d24&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T04%3A10%3A02Z&ske=2026-10-15T04%3A10%3A02Z&sks=b&skv=2026-02-06&sig=lhDJkx8A/SYuqkAmI%2Bxora41DPPcTkLuNyRD1tWHeg0%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force

      - name: Validar SHA-256
        shell: pwsh
        run: |
          $exe = 'artifact/CourseVault-Setup-1.1.3-x64.exe'
          if (-not (Test-Path $exe)) { throw 'Instalador não encontrado no artefato.' }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '73afe8a380fe6537e4a10e527b0ad74021329f129f805d3abe2e70dc35979fa8'
          if ($hash -ne $expected) { throw "SHA-256 inválido: $hash" }
          Write-Host "SHA-256 validado: $hash"

      - name: Criar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.3 `
            'artifact/CourseVault-Setup-1.1.3-x64.exe' `
            'artifact/CourseVault-Setup-1.1.3-x64.exe.sha256' `
            --title 'CourseVault 1.1.3' `
            --notes 'Remove a faixa de teste da v1.1.2. O atualizador passa a instalar silenciosamente e reabrir o CourseVault ao concluir.'

      - name: Atualizar feed público
        shell: pwsh
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'CourseVault'
            version = '1.1.3'
            publishedAt = $publishedAt
            installerUrl = 'https://github.com/kauandonargas/coursevault-releases/releases/download/v1.1.3/CourseVault-Setup-1.1.3-x64.exe'
            sha256 = '73afe8a380fe6537e4a10e527b0ad74021329f129f805d3abe2e70dc35979fa8'
            mandatory = $false
            notes = @(
              'Remove a faixa amarela de teste da versão 1.1.2.',
              'A instalação iniciada pelo CourseVault passa a ser silenciosa.',
              'O CourseVault fecha durante a atualização e abre novamente ao terminar.'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content update.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Atualiza feed para CourseVault 1.1.3'
          git push
