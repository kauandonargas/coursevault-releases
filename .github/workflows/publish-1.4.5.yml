name: Publicar CourseVault 1.4.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador do build Windows aprovado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3b94-820e-a977-173501f67bd5/raw?se=2026-11-07T09%3A10%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=691c563d-25f3-55e8-b8af-2e2114958f31&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A20%3A43Z&ske=2026-11-08T00%3A20%3A43Z&sks=b&skv=2026-02-06&sig=zrxa0hriuR1M5E126xhqEzzbLE8bKrrJ%2BTmv8Ej7MSA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output artifact.zip "$ARTIFACT_URL"
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Validar SHA-256 do instalador
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          echo "9ef46ace419c3cc6b9517dd64e1cde5f562fc1178fa28b6f73b00b4cf70508f2  CourseVault-Setup-1.4.5-x64.exe" | sha256sum --check -
          sha256sum --check CourseVault-Setup-1.4.5-x64.exe.sha256
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.5 \
            artifact/CourseVault-Setup-1.4.5-x64.exe \
            artifact/CourseVault-Setup-1.4.5-x64.exe.sha256 \
            --title "CourseVault 1.4.5" \
            --notes "Resolução original ao passar o mouse ou abrir obras; ordenações por nome, tamanho, resolução, proporção, data e formato. Copiar arquivo original para o Explorador (Ctrl+C), colar imagens diretamente na pasta do artista (Ctrl+V), não sobrescrever arquivos existentes e reanalisar galeria. Mosaico, zoom e dados preservados."
      - name: Atualizar canal de atualização do CourseVault
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          manifest={
              "schemaVersion":1,
              "product":"CourseVault",
              "version":"1.4.5",
              "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.5/CourseVault-Setup-1.4.5-x64.exe",
              "sha256":"9ef46ace419c3cc6b9517dd64e1cde5f562fc1178fa28b6f73b00b4cf70508f2",
              "mandatory":False,
              "notes":[
                  "Exibe somente a resolução do arquivo original em pixels ao passar o mouse e no visor.",
                  "Ordenações por nome, tamanho em disco, resolução, largura, altura, proporção, data e formato.",
                  "Copiar arquivo original (Ctrl+C) para colar no Explorador ou em outro artista.",
                  "Colar imagens (Ctrl+V) na pasta física do artista, sem sobrescrever nomes existentes.",
                  "Galeria atualizada após colagem; mosaico natural, zoom e dados preservados."
              ]
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publicar atualização CourseVault 1.4.5"
          git push
