name: Publicar CourseVault 1.4.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENCODED_ASSET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador validado de CourseVault
        shell: bash
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$ENCODED_ASSET_URL" | base64 --decode | tr -d '"')"
          case "$URL" in https://release-assets.githubusercontent.com/*) ;; *) echo "URL de asset nao permitida"; exit 1;; esac
          curl --fail --location --retry 3 --silent --show-error --output CourseVault-Setup-1.4.8-x64.exe "$URL"
          echo "8980a7599ecd0a989ac21c28586e2ceb53a02fd48420e80b2fd90575a8686024  CourseVault-Setup-1.4.8-x64.exe" | sha256sum --check -
          sha256sum CourseVault-Setup-1.4.8-x64.exe > CourseVault-Setup-1.4.8-x64.exe.sha256
          ls -lh CourseVault-Setup-1.4.8-x64.exe
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.8 \
            CourseVault-Setup-1.4.8-x64.exe \
            CourseVault-Setup-1.4.8-x64.exe.sha256 \
            --title "CourseVault 1.4.8" \
            --notes "Whisper recompilado para CPU Windows x64 generica (sem SSE4.2/BMI2/AVX obrigatorios). Corrige erro 3221225501 (0xC000001D) na geracao de legendas. Testes de inferencia completos aprovados. FFmpeg e modelo multilingue inclusos; GPU opcional nao incluida."
      - name: Atualizar canal de versoes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          manifest={
            "schemaVersion":1,
            "product":"CourseVault",
            "version":"1.4.8",
            "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
            "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.8/CourseVault-Setup-1.4.8-x64.exe",
            "sha256":"8980a7599ecd0a989ac21c28586e2ceb53a02fd48420e80b2fd90575a8686024",
            "mandatory":False,
            "notes":[
              "Corrige falha 3221225501 (0xC000001D) no motor de legendas do Windows.",
              "Whisper recompilado com CPU x64 generica, sem depender de SSE4.2, BMI2 ou AVX.",
              "Modelo Whisper completo e inferencia real verificados na compilacao Windows.",
              "Legendas continuam geradas por um clique, offline, com FFmpeg e modelo inclusos.",
              "A placa de video nao e necessaria; aceleracao por GPU nao faz parte desta versao."
            ]
          }
          with open('update.json','w',encoding='utf-8') as f:
            json.dump(manifest,f,ensure_ascii=False,indent=2)
            f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Publicar atualizacao CourseVault 1.4.8'
          git push
