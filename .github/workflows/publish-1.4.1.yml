name: Publicar CourseVault 1.4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador do build Windows aprovado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-eb88-820e-8ec1-37dfa312ef1c/raw?se=2026-11-07T06%3A16%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=53ba6457-b3bb-5029-8b13-9941635f08f8&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A20%3A43Z&ske=2026-11-08T00%3A20%3A43Z&sks=b&skv=2026-02-06&sig=EpuRoLLdIWo63yr/UxzgiUUMRGr65xl7GkYySKJl6XU%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output artifact.zip "$ARTIFACT_URL"
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Validar SHA-256 do instalador
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          echo "41c8b3dc230dbb451d2d95bbcba978b19d7fe563d2a56a78e0549562999f2747  CourseVault-Setup-1.4.1-x64.exe" | sha256sum --check -
          sha256sum --check CourseVault-Setup-1.4.1-x64.exe.sha256
      - name: Publicar release do Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.1 \
            artifact/CourseVault-Setup-1.4.1-x64.exe \
            artifact/CourseVault-Setup-1.4.1-x64.exe.sha256 \
            --title "CourseVault 1.4.1" \
            --notes "Correção de carregamento em galerias de artistas com muitas imagens. Masonry virtualizado com cartões em posições estáveis, miniaturas sob demanda, cache de falhas e sem carregamento automático dos originais gigantes. Menus e visualização ampliada preservados; dados existentes mantidos."
      - name: Atualizar canal de atualização do CourseVault
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          manifest={
              "schemaVersion":1,
              "product":"CourseVault",
              "version":"1.4.1",
              "publishedAt":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "installerUrl":"https://github.com/kauandonargas/coursevault-releases/releases/download/v1.4.1/CourseVault-Setup-1.4.1-x64.exe",
              "sha256":"41c8b3dc230dbb451d2d95bbcba978b19d7fe563d2a56a78e0549562999f2747",
              "mandatory":False,
              "notes":[
                  "Galerias de artistas agora carregam apenas miniaturas próximas da área visível.",
                  "Posições das imagens são reservadas antecipadamente, eliminando saltos de layout.",
                  "Falhas de miniaturas não fazem mais a grade carregar imagens originais gigantes.",
                  "Mesma navegação, visor de obras e menus de botão direito; dados preservados."
              ]
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publicar atualização CourseVault 1.4.1"
          git push
